services:
  web:
    image: localhost/kanban-frontend
    container_name: kf
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend

  api:
    image: localhost/kanban-backend
    container_name: kb
    restart: unless-stopped
    environment:
      - ENVIRONMENT=Production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=password
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - database

  db:
    image: postgres
    container_name: kd
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    networks:
      - database
    volumes:
      - ./postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d kanban-database'"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  frontend:
  database:
