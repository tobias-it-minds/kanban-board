services:
  web:
    image: localhost/kanban-frontend
    container_name: kf
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - frontend

  api:
    image: localhost/kanban-backend
    container_name: kb
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - frontend
      - database

  db:
    image: postgres
    container_name: kd
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    networks:
      - database

networks:
  frontend:
  database:
